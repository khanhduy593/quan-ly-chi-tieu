<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột như app điện thoại, thanh tab dưới, nút + ở giữa. Chỉ 2 tông: xanh rêu đậm và trắng mint; mọi sắc độ khác là độ trong của 2 tông này. */
:root{
  --tone-a:#0e4139;
  --tone-b:#eef5f0;
  --bg:var(--tone-b);
  --fg:var(--tone-a);
  --mid:color-mix(in srgb,var(--fg) 58%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 18%,var(--bg));
  --soft:color-mix(in srgb,var(--fg) 7%,var(--bg));
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:var(--tone-a);--fg:var(--tone-b);color-scheme:dark}}
:root[data-theme="dark"]{--bg:var(--tone-a);--fg:var(--tone-b);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;height:100%}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--font);
  height:100%;padding-block:0;overscroll-behavior:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
input,textarea,select,button{font:inherit;color:inherit}
button,.tab,.row,.dchip{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.shell{height:100%;max-width:560px;margin:0 auto;min-width:0;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

.top{flex:none;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);font-weight:600}
h1{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ic{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.ic svg,.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txtbtn{font-weight:600;padding:10px 4px}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;padding:6px 0 30px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec>h2,.cardhead h2{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);font-weight:700}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{border:1.5px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.muted{color:var(--mid)}
.small{font-size:13px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav .lbl{font-weight:700;font-size:17px;padding:8px 10px}
.monthnav .ic{width:40px;height:40px}

.hero{background:var(--fg);color:var(--bg);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.hero .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero .big{font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid color-mix(in srgb,var(--bg) 30%,var(--fg));padding-top:12px}
.hero .two b{display:block;font-size:18px;font-weight:700}
.hero .two span{font-size:12px;opacity:.75}
.hero .foot{font-size:13px;opacity:.85}

.alert{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--fg);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.alert.over{background:var(--fg);color:var(--bg)}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert small{display:block;font-weight:500;opacity:.85;font-size:13px}

svg.chart{display:block;width:100%;height:auto}
.bar-solid{fill:var(--fg)}
.bar-hatch{fill:url(#hatch);stroke:var(--fg);stroke-width:1.5}
.bar-ring{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.cv{font:700 11px var(--font);fill:var(--fg)}
.cl{font:500 11px var(--font);fill:var(--mid)}
.axis{stroke:var(--fg);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.ph{fill:var(--bg)}.pl{stroke:var(--fg)}
.trend{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round}
.dot{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mid);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--fg)}
.legend i.s{background:var(--fg)}
.legend i.h{background:repeating-linear-gradient(45deg,var(--fg) 0 2px,var(--bg) 2px 5px)}
.legend i.r{background:var(--bg);border-radius:50%}

.limit{display:flex;flex-direction:column;gap:6px}
.limit+.limit{margin-top:12px}
.limit .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.limit b{font-weight:700}
.bar{height:12px;border-radius:7px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mid);border-radius:7px}
.bar.near i{background:var(--fg)}
.bar.over i{background:repeating-linear-gradient(45deg,var(--fg) 0 5px,var(--bg) 5px 8px);border-right:0}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1.5px solid var(--fg);white-space:nowrap}
.pill.inv{background:var(--fg);color:var(--bg)}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:46px;border:1.5px solid var(--line);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.dchip small{font-size:11px;color:var(--mid);font-weight:600}
.dchip b{font-size:16px;font-weight:700}
.dchip i{width:5px;height:5px;border-radius:50%;background:transparent}
.dchip i.dot{background:var(--fg)}
.dchip.today{border-color:var(--fg)}
.dchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dchip.on small{color:var(--bg);opacity:.8}
.dchip.on i.dot{background:var(--bg)}
.dchip.all{justify-content:center;padding:6px 12px;font-weight:700;font-size:14px}
.sheet.tall{height:92%}
.chips.strip2{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips.strip2::-webkit-scrollbar{display:none}
.chips.strip2 .chip{white-space:nowrap}
.chip.cw{display:inline-flex;align-items:center;padding:0}
.chip.cw>button{font-weight:600;font-size:13px;padding:6px 4px 6px 11px}
.chip.cw>button:first-child:last-child{padding:6px 11px}
.chip.cw .cx{padding:6px 10px 6px 4px;display:grid;place-items:center}
.chip.cw .cx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.chip.dots{display:inline-flex;align-items:center;justify-content:center;min-width:44px}
.chip.dots svg{width:18px;height:18px;fill:currentColor}
.limgrp{gap:6px;padding-bottom:10px}
.chip.plus{border-style:dashed;border-color:var(--fg)}
.addrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.addrow .inp{min-height:42px;padding:8px 12px}
#catfoot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:4px}
#lhint{min-height:20px}
.dsum{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;padding:10px 14px}
.catrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.catrow+.catrow{margin-top:8px}
.catrow .bar{height:8px}
.catrow .bar i{background:var(--fg)}

.day{font-size:12px;font-weight:700;color:var(--mid);letter-spacing:.04em;padding:12px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .dl{border:0;padding:4px 0;border-radius:0;color:var(--mid);letter-spacing:.04em;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;background:none}
.day button{font-size:12px;font-weight:700;color:var(--fg);border:1.5px solid var(--line);border-radius:99px;padding:4px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l span{display:block;font-size:13px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-weight:700;white-space:nowrap}
.row .r.out{font-weight:500}

.fut{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fut .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%}
.fut .note{font-size:13px;color:var(--mid);overflow-wrap:anywhere}
.fut .acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--fg);font-weight:600}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

.two-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .k{font-size:12px;color:var(--mid);font-weight:600}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat.inv{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stat.inv .k{color:var(--bg);opacity:.75}

.goal{display:flex;flex-direction:column;gap:10px}
.goal .nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.goal .bar{height:14px}
.goal .bar i{background:var(--fg)}
.goal.done{background:var(--soft)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);text-align:right;padding:6px 4px;font-weight:700}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tr.jump{cursor:pointer}
.tablewrap{overflow-x:auto}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

.nav{flex:none;position:relative;z-index:25;background:var(--bg);border-top:1.5px solid var(--line);margin-inline:-16px;padding:6px 16px max(0px,calc(var(--sb,0px) - 32px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--mid)}
.tab.on{color:var(--fg)}
.tab.on span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:-26px auto 0;border:4px solid var(--bg);box-shadow:0 0 0 1.5px var(--fg)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;width:min(92vw,520px);background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 0 0 2px var(--bg)}
.toast b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:2px}

.layer{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--fg) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--fg);border-bottom:0}
.sheet>*{flex-shrink:0}
.main>*,main>*{flex-shrink:0}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.sheet .hd h3{flex:1;text-align:center}
.sheet .hd .txtbtn{padding:8px 0;min-width:48px}
.sheet .hd .btn{min-width:64px}
.sheet h3{margin:0;font-size:18px}
.dlg{align-items:center;padding:16px}
.dlg .sheet{padding-top:18px;border-radius:20px;border:1.5px solid var(--fg);max-height:80%}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--fg);border-radius:12px;overflow:hidden}
.seg button{padding:11px 8px;text-align:center;font-weight:600;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:flex-start}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.inp{-webkit-appearance:none;appearance:none;text-align:left;width:100%;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.inp.amt{font-size:26px;font-weight:700;letter-spacing:-.01em}
textarea.inp{min-height:110px;resize:vertical;font-size:13px;line-height:1.4}
.suffix{position:relative}
.suffix .inp{padding-right:44px}
.suffix::after{content:"đ";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mid);font-weight:700}
.suffix.big::after{font-size:20px}
.zeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;height:34px;overflow:hidden}
.clr{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;z-index:1}
.clr svg{width:14px;height:14px;stroke:var(--fg);fill:none;stroke-width:2.5;stroke-linecap:round}
.suffix .inp.amt{padding-right:78px}
.zeros button{border:1.5px solid var(--line);border-radius:9px;height:34px;padding:0 2px;text-align:center;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden}
.zeros button:active{background:var(--fg);color:var(--bg)}
.hint{font-size:13px;color:var(--mid)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (max-width:380px){.hero .big{font-size:32px}.two-cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
#auth{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--fg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(24px,env(safe-area-inset-top,0px)) 20px 24px;display:flex;justify-content:center;align-items:flex-start}
#auth[hidden]{display:none}
.dlg{z-index:90}
#toast{z-index:95}
.authbox{width:100%;max-width:420px;margin-top:5vh;display:flex;flex-direction:column;gap:12px}
.authlogo{width:64px;height:64px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:34px;font-weight:700;margin:0 auto}
.authbox h1{text-align:center;font-size:24px;margin:0}
.authbox .c{text-align:center}
.authtabs{display:flex;border:2px solid var(--fg);border-radius:14px;overflow:hidden}
.authtabs button{flex:1;padding:12px;font:inherit;font-weight:600;background:transparent;color:var(--fg);border:0}
.authtabs button.on{background:var(--fg);color:var(--bg)}
.authbox form{display:flex;flex-direction:column;gap:8px}
.authbox label{font-size:13px;font-weight:600;margin-top:4px}
.aumsg{min-height:20px;font-size:14px;text-align:center}
.authtabs button,.authbox .txtbtn{text-align:center;justify-content:center}
.authbox .txtbtn{align-self:center}
.about{padding:4px 0 8px}.about .authlogo{margin:8px auto}.about h2{text-align:center;font-size:22px;margin:6px 0}
.about .lead{text-align:center;color:var(--mid);margin:0 0 8px}.about h3{font-size:15px;margin:18px 0 6px}

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayS=function(){return iso(new Date())};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var grp=function(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
var money=function(n){var v=Math.round(Math.abs(n));return (n<0?'−':'')+grp(v)+'đ'};
var compact=function(n){var a=Math.abs(n),s=n<0?'−':'',t;
  if(a>=1e9){t=(a/1e9).toFixed(1).replace('.',',').replace(',0','')+' tỷ'}
  else if(a>=1e6){t=(a/1e6).toFixed(1).replace('.',',').replace(',0','')+'tr'}
  else if(a>=1e3){t=Math.round(a/1e3)+'k'}
  else t=String(Math.round(a));
  return s+t};
var parseAmt=function(v){return parseInt(String(v||'').replace(/\D/g,''),10)||0};
var mkey=function(d){return d.slice(0,7)};
var DOW=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
var dLabel=function(s){var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return DOW[d.getDay()]+', '+pad(p[2])+'/'+pad(p[1])};
var dShort=function(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var mLabel=function(m){return 'Tháng '+(+m.slice(5))+'/'+m.slice(0,4)};
var shiftMonth=function(m,dl){var a=m.split('-').map(Number),y=a[0],mo=a[1]+dl;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)};
var ICON={
  chevL:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>'
};

/* ---------- danh mục ---------- */
var EXP=['Ăn uống','Đồ dùng cá nhân','Sự cố phát sinh','Bỏ heo','Đầu tư','Dịch vụ','Sức khoẻ','Bảo hiểm nhân thọ','Nhà ở & hoá đơn','Di chuyển','Giải trí','Khác'];
var INC=['Lương','Lãi','Thưởng','Phụ cấp','Làm thêm','Bán hàng','Khác'];
var LNAMES={food:'Ăn uống',personal:'Đồ dùng cá nhân',incident:'Sự cố phát sinh'};
var LIMITS=['food','personal','incident'].map(function(k){return {k:k,get cat(){return S.lnames[k]},get label(){return S.lnames[k]}}});

/* ---------- dữ liệu ---------- */
var DEF=function(){return {lnames:Object.assign({},LNAMES),cats:{out:EXP.slice(),in:INC.slice()},tx:[],future:[],goals:[],limits:{food:3000000,personal:1000000,incident:1000000},opening:0,lastBackup:0}};
var okItem=function(t){return t&&typeof t==='object'&&typeof t.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&isFinite(+t.amt)&&(t.type==='in'||t.type==='out')};
function norm(o){
  var d=DEF();o=o||{};
  var fix=function(t){return {id:String(t.id||uid()),type:t.type,cat:String(t.cat||'Khác'),amt:Math.abs(+t.amt),date:t.date,note:String(t.note||'')}};
  d.tx=(Array.isArray(o.tx)?o.tx:[]).filter(okItem).map(fix);
  d.future=(Array.isArray(o.future)?o.future:[]).filter(okItem).map(fix);
  d.goals=(Array.isArray(o.goals)?o.goals:[]).filter(function(g){return g&&typeof g==='object'&&g.name}).map(function(g){return {id:String(g.id||uid()),name:String(g.name),target:Math.abs(+g.target)||0,saved:Math.max(0,+g.saved||0),deadline:/^\d{4}-\d{2}-\d{2}$/.test(g.deadline||'')?g.deadline:'',note:String(g.note||'')}});
  var L=o.limits||{};
  ['food','personal','incident'].forEach(function(k){if(isFinite(+L[k])&&L[k]!=='')d.limits[k]=Math.max(0,+L[k])});
  var C=o.cats||{};
  ['out','in'].forEach(function(k){
    var l=Array.isArray(C[k])?C[k].map(function(x){return String(x).trim()}).filter(function(x,i,a){return x&&a.indexOf(x)===i}):[];
    if(l.length)d.cats[k]=l;
  });
  var LN=o.lnames||{};
  Object.keys(LNAMES).forEach(function(k){var v=String(LN[k]||'').trim();if(v)d.lnames[k]=v});
  Object.keys(d.lnames).forEach(function(k){if(d.cats.out.indexOf(d.lnames[k])<0)d.cats.out.unshift(d.lnames[k])});
  d.opening=isFinite(+o.opening)?+o.opening:0;
  d.lastBackup=+o.lastBackup||0;
  d.ts=+o.ts||0;
  return d;
}
function load(){try{var r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}return DEF()}
var S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.ts=Date.now();persist();if(typeof schedulePush==='function')schedulePush()}

var ui={view:'month',month:mkey(todayS()),day:null,year:new Date().getFullYear()};
var WD=['CN','T2','T3','T4','T5','T6','T7'];

/* ---------- tính toán ---------- */
function sums(list){var i=0,o=0;list.forEach(function(t){if(t.type==='in')i+=t.amt;else o+=t.amt});return {i:i,o:o,r:i-o}}
function inMonth(m){return S.tx.filter(function(t){return mkey(t.date)===m})}
function balance(){var s=sums(S.tx);return S.opening+s.r}
function limitStatus(m){
  var list=inMonth(m);
  return LIMITS.map(function(L){
    var spent=list.filter(function(t){return t.type==='out'&&t.cat===L.cat}).reduce(function(a,t){return a+t.amt},0);
    var lim=+S.limits[L.k]||0,r=lim>0?spent/lim:0;
    return {k:L.k,cat:L.cat,label:L.label,spent:spent,lim:lim,r:r,st:lim<=0?'off':(r>=1?'over':(r>=0.8?'near':'ok'))};
  });
}
var RANK={off:0,ok:0,near:1,over:2};

/* ---------- biểu đồ ---------- */
function bars(items){
  var W=320,H=200,T=26,B=32,L=10,R=10;
  var vals=items.map(function(x){return x.v});
  var mx=Math.max.apply(null,[0].concat(vals)),mn=Math.min.apply(null,[0].concat(vals));
  if(mx===mn)mx=1;
  var y=function(v){return T+(mx-v)*(H-T-B)/(mx-mn)};
  var y0=y(0),bw=64,gap=(W-L-R-bw*items.length)/(items.length+1),g='';
  items.forEach(function(it,i){
    var x=L+gap+i*(bw+gap),yy=y(it.v),top=Math.min(yy,y0),h=Math.max(Math.abs(yy-y0),it.v?2:0);
    g+='<rect x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="5" class="bar-'+it.t+'"/>';
    var ly=it.v>=0?top-7:top+h+14;
    g+='<text x="'+(x+bw/2)+'" y="'+ly+'" text-anchor="middle" class="cv">'+compact(it.v)+'</text>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" class="cl">'+it.l+'</text>';
  });
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y0+'" y2="'+y0+'" class="axis"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ thu nhập, chi tiêu và tiền dư">'+g+'</svg>';
}
function yearChart(y){
  var rows=[],m;
  for(m=1;m<=12;m++)rows.push(sums(inMonth(y+'-'+pad(m))));
  var W=340,H=220,T=22,B=26,L=40,R=8;
  var all=[0];rows.forEach(function(r){all.push(r.i,r.o,r.r)});
  var mx=Math.max.apply(null,all),mn=Math.min.apply(null,all);
  if(mx===mn)mx=1;
  var Y=function(v){return T+(mx-v)*(H-T-B)/(mx-mn)};
  var gw=(W-L-R)/12,bw=gw*0.33,g='';
  [mx,0].concat(mn<0?[mn]:[]).forEach(function(v){
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="'+(v===0?'axis':'grid')+'"/>';
    g+='<text x="'+(L-5)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="cl">'+compact(v)+'</text>';
  });
  var pts=[];
  rows.forEach(function(r,i){
    var x=L+i*gw+gw*0.12,y0=Y(0);
    var hi=Math.abs(Y(r.i)-y0),ho=Math.abs(Y(r.o)-y0);
    if(r.i)g+='<rect x="'+x+'" y="'+Math.min(Y(r.i),y0)+'" width="'+bw+'" height="'+hi+'" rx="2" class="bar-solid"/>';
    if(r.o)g+='<rect x="'+(x+bw+1)+'" y="'+Math.min(Y(r.o),y0)+'" width="'+bw+'" height="'+ho+'" rx="2" class="bar-hatch" style="stroke-width:1"/>';
    g+='<text x="'+(L+i*gw+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" class="cl">'+(i+1)+'</text>';
    pts.push([L+i*gw+gw/2,Y(r.r)]);
  });
  g+='<polyline class="trend" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p){g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" class="dot"/>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ thu, chi và dư theo từng tháng trong năm">'+g+'</svg>'+
   '<div class="legend"><span><i class="s"></i>Thu nhập</span><span><i class="h"></i>Chi tiêu</span><span><i class="r"></i>Tiền dư (đường)</span></div>';
}

/* ---------- các màn hình ---------- */
function alertsHtml(ls){
  return ls.filter(function(x){return x.st==='over'||x.st==='near'}).map(function(x){
    if(x.st==='over')return '<div class="alert over">'+ICON.warn+'<div>Đã vượt giới hạn '+esc(x.label)+'<small>Đã chi '+money(x.spent)+' / '+money(x.lim)+', vượt '+money(x.spent-x.lim)+'</small></div></div>';
    return '<div class="alert">'+ICON.warn+'<div>Sắp vượt giới hạn '+esc(x.label)+'<small>Đã dùng '+Math.round(x.r*100)+'%, còn '+money(x.lim-x.spent)+'</small></div></div>';
  }).join('');
}
function txRow(t,act){
  var sign=t.type==='in'?'+':'−';
  return '<button class="row" data-act="'+act+'" data-id="'+esc(t.id)+'"><div class="l"><b>'+esc(t.cat)+'</b><span>'+(t.note?esc(t.note):'&nbsp;')+'</span></div><div class="r num '+t.type+'">'+sign+grp(Math.round(t.amt))+'đ</div></button>';
}
function dayStrip(m,list){
  var y=+m.slice(0,4),mo=+m.slice(5),n=new Date(y,mo,0).getDate(),has={},t=todayS();
  list.forEach(function(x){has[x.date]=1});
  var h='<div class="strip" id="strip"><button class="dchip all'+(!ui.day?' on':'')+'" data-act="day-pick" data-d="">Cả tháng</button>';
  for(var d=1;d<=n;d++){var ds=m+'-'+pad(d);
    h+='<button class="dchip'+(ui.day===ds?' on':'')+(ds===t?' today':'')+'" data-act="day-pick" data-d="'+ds+'" aria-label="Ngày '+d+'"><small>'+WD[new Date(y,mo-1,d).getDay()]+'</small><b>'+d+'</b><i class="'+(has[ds]?'dot':'')+'"></i></button>'}
  return h+'</div>';
}
function vMonth(){
  var m=ui.month,list=inMonth(m),s=sums(list),ls=limitStatus(m),h='';
  h+='<div class="monthnav"><button class="ic" data-act="m-prev" aria-label="Tháng trước">'+ICON.chevL+'</button><button class="lbl" data-act="m-now" aria-label="Về tháng hiện tại">'+mLabel(m)+'</button><button class="ic" data-act="m-next" aria-label="Tháng sau">'+ICON.chevR+'</button></div>';
  h+=alertsHtml(ls);
  h+='<div class="hero"><div><div class="k">Tiền dư trong tháng</div><div class="big num">'+money(s.r)+'</div></div>'+
     '<div class="two"><div><b class="num">+'+money(s.i)+'</b><span>Thu nhập</span></div><div><b class="num">−'+money(s.o)+'</b><span>Chi tiêu</span></div></div>'+
     '<div class="foot">Số dư hiện tại: <b class="num">'+money(balance())+'</b></div></div>';
  var L2=ui.day?list.filter(function(t){return t.date===ui.day}):list,s2=sums(L2);
  h+='<section class="sec"><div class="cardhead"><h2>Xem theo ngày</h2><span class="hint small">Chạm một ngày để xem hoặc sửa</span></div>'+dayStrip(m,list)+
     (ui.day?'<div class="card dsum"><b>'+dLabel(ui.day)+'</b><span class="num">Thu +'+compact(s2.i)+' · Chi −'+compact(s2.o)+'</span></div>':'')+'</section>';
  if(!S.tx.length&&!S.future.length&&!S.goals.length){
    h+='<div class="empty"><div><b>Chưa có dữ liệu</b><div class="hint">Bấm nút + bên dưới để thêm thu nhập hoặc chi tiêu.</div></div></div>';
  }
  h+='<section class="card"><div class="cardhead"><h2>Thu, chi và dư</h2><span class="hint">'+mLabel(m)+'</span></div>'+bars([{l:'Thu nhập',v:s.i,t:'solid'},{l:'Chi tiêu',v:s.o,t:'hatch'},{l:'Tiền dư',v:s.r,t:'ring'}])+'</section>';
  h+='<section class="card"><div class="cardhead"><h2>Giới hạn chi tiêu</h2><button class="txtbtn small" data-act="nav" data-v="settings">Chỉnh</button></div><div>';
  h+=ls.map(function(x){
    if(x.st==='off')return '<div class="limit"><div class="row1"><b>'+esc(x.label)+'</b><span class="muted small">Chưa đặt giới hạn</span></div></div>';
    var pc=Math.min(100,x.r*100);
    var badge=x.st==='over'?'<span class="pill inv">Vượt</span>':(x.st==='near'?'<span class="pill">Sắp vượt</span>':'');
    return '<div class="limit"><div class="row1"><b>'+esc(x.label)+' '+badge+'</b><span class="num small">'+compact(x.spent)+' / '+compact(x.lim)+'</span></div><div class="bar '+x.st+'"><i style="width:'+pc+'%"></i></div></div>';
  }).join('');
  h+='</div></section>';
  var by={};list.forEach(function(t){if(t.type==='out')by[t.cat]=(by[t.cat]||0)+t.amt});
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(cats.length){
    var top=by[cats[0]];
    h+='<section class="card"><div class="cardhead"><h2>Chi theo mục</h2></div>'+cats.map(function(c){return '<div class="catrow"><span>'+esc(c)+'</span><div class="bar"><i style="width:'+(by[c]/top*100)+'%"></i></div><b class="num">'+compact(by[c])+'</b></div>'}).join('')+'</section>';
  }
  var byDate=function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)};
  var ins=L2.filter(function(t){return t.type==='in'}).sort(byDate),outs=L2.filter(function(t){return t.type==='out'}).sort(byDate);
  h+='<section class="card"><div class="cardhead"><h2>'+(ui.day?'Thu nhập trong ngày':'Thu nhập tháng này')+'</h2><b class="num">+'+money(s2.i)+'</b></div>';
  if(!ins.length)h+='<div class="hint" style="padding:8px 0">Chưa có khoản thu nào'+(ui.day?' trong ngày này':'')+'. Bấm nút + để thêm.</div>';
  else ins.forEach(function(t){h+=txRow(t,'edit-tx').replace('<span>','<span>'+dShort(t.date).slice(0,5)+(t.note?' · ':''))});
  h+='</section>';
  h+='<section class="sec"><h2>'+(ui.day?'Chi tiêu trong ngày':'Chi tiêu')+'</h2>';
  if(!outs.length)h+='<div class="hint">'+(ui.day?'Ngày này':'Tháng này')+' chưa có khoản chi. Bấm nút + để thêm.</div>';
  else{var cur='';outs.forEach(function(t){if(t.date!==cur){cur=t.date;h+='<div class="day"><button class="dl" data-act="day-open" data-d="'+t.date+'" aria-label="Xem riêng '+dLabel(t.date)+'">'+dLabel(t.date)+(ui.day===t.date?' · Xem cả tháng':'')+'</button><button data-act="day-move" data-d="'+t.date+'">Dời ngày</button></div>'}h+=txRow(t,'edit-tx')})}
  h+='</section>';
  return h;
}
function vFuture(){
  var cur=balance(),pend=S.future.slice().sort(function(a,b){return a.date.localeCompare(b.date)}),run=cur,t=todayS(),h='';
  var net=pend.reduce(function(a,x){return a+(x.type==='in'?x.amt:-x.amt)},0),fin=cur+net;
  h+='<div class="two-cards"><div class="card stat"><div class="k">Số dư hiện tại</div><div class="v num">'+money(cur)+'</div></div><div class="card stat inv"><div class="k">Dự kiến sau các khoản sắp tới</div><div class="v num">'+money(fin)+'</div></div></div>';
  h+='<section class="sec"><h2>Khoản sắp tới ('+pend.length+')</h2>';
  if(!pend.length)h+='<div class="empty"><div class="hint">Chưa có khoản nào. Bấm nút + để thêm tiền lương sắp nhận, học phí, phí bảo hiểm… để biết số dư sau này.</div></div>';
  pend.forEach(function(x){
    run+=x.type==='in'?x.amt:-x.amt;
    var late=x.date<t;
    h+='<div class="fut"><button class="top2" data-act="edit-future" data-id="'+esc(x.id)+'"><div class="l" style="min-width:0"><b>'+esc(x.cat)+'</b> '+(late?'<span class="pill inv">Đến hạn</span>':'')+'<div class="small muted">'+dLabel(x.date)+' · '+dShort(x.date)+'</div></div><b class="num" style="white-space:nowrap">'+(x.type==='in'?'+':'−')+grp(Math.round(x.amt))+'đ</b></button>'+
      (x.note?'<div class="note">'+esc(x.note)+'</div>':'')+
      '<div class="acts"><span class="small">Số dư sau: <b class="num">'+money(run)+'</b> '+(run<0?'<span class="pill inv">Thiếu tiền</span>':'')+'</span><button class="btn sm" data-act="future-done" data-id="'+esc(x.id)+'">Đã xảy ra</button></div></div>';
  });
  h+='</section>';
  return h;
}
function vGoals(){
  var h='<button class="btn pri wide" data-act="goal-new">Thêm mục tiêu</button>';
  if(!S.goals.length)h+='<div class="empty"><div class="hint">Đặt mục tiêu như mua laptop, quỹ khẩn cấp, du lịch… rồi nạp tiền dần vào.</div></div>';
  var t=todayS();
  S.goals.forEach(function(g){
    var pc=g.target>0?Math.min(100,g.saved/g.target*100):0,done=g.target>0&&g.saved>=g.target,extra='';
    if(g.deadline&&!done){
      var days=Math.round((new Date(g.deadline+'T00:00:00')-new Date(t+'T00:00:00'))/864e5);
      if(days<0)extra='Đã quá hạn '+(-days)+' ngày';
      else{var ml=Math.max(1,Math.ceil(days/30));extra='Còn '+days+' ngày · cần dành khoảng '+money((g.target-g.saved)/ml)+'/tháng'}
    }
    h+='<section class="card goal'+(done?' done':'')+'"><div class="cardhead"><div class="nm">'+esc(g.name)+'</div>'+(done?'<span class="pill inv">Hoàn thành</span>':'<b class="num">'+Math.round(pc)+'%</b>')+'</div>'+
      '<div class="bar"><i style="width:'+pc+'%"></i></div>'+
      '<div class="row1" style="display:flex;justify-content:space-between;gap:8px"><b class="num">'+money(g.saved)+'</b><span class="muted num">/ '+money(g.target)+'</span></div>'+
      (g.deadline?'<div class="small muted">Hạn '+dShort(g.deadline)+(extra?' · '+extra:'')+'</div>':'')+
      (g.note?'<div class="small muted" style="overflow-wrap:anywhere">'+esc(g.note)+'</div>':'')+
      '<div class="btnrow"><button class="btn pri sm" data-act="goal-add" data-id="'+esc(g.id)+'">Nạp / rút tiền</button><button class="btn sm" data-act="goal-edit" data-id="'+esc(g.id)+'">Sửa</button></div></section>';
  });
  return h;
}
function vYear(){

function saveTx(){

  var date=$('#f-date').value||todayS(),note=$('#f-note').value.trim();
  var arr=sh.kind==='future'?S.future:S.tx;

  if(sh.id){var it=arr.filter(function(x){return x.id===sh.id})[0];if(it){it.type=sh.type;it.cat=sh.cat;it.amt=amt;it.date=date;it.note=note}}

  if(sh.kind==='tx'){ui.month=mkey(date);if(ui.day)ui.day=date;ui.view='month'}else ui.view='future';

function limitAlerts(before,m){
  var after=limitStatus(m),worst=null;
  after.forEach(function(a,i){if(RANK[a.st]>RANK[before[i].st]&&(!worst||RANK[a.st]>RANK[worst.st]))worst=a});
  if(!worst){toast('Đã lưu');return}
  if(worst.st==='over')toast('Đã vượt giới hạn '+esc(worst.label)+': '+money(worst.spent)+' / '+money(worst.lim),true);
  else toast('Sắp vượt giới hạn '+esc(worst.label)+': đã dùng '+Math.round(worst.r*100)+'%, còn '+money(worst.lim-worst.spent),true);
}

function push(){

}
function cloudOut(){
  ask('Đăng xuất? Dữ liệu vẫn còn trên máy này. Đăng nhập lại là đồng bộ tiếp.','Đăng xuất').then(function(ok){
    if(!ok)return;
    clearTimeout(pushT);A={skip:true};idTok='';saveAuth();sync.state='';render(true);toast('Đã đăng xuất');
  });
}
function accountCard(){
  if(A.uid)return '<section class="card sec"><div class="cardhead"><h2>Tài khoản</h2></div><div class="hint">Đã đăng nhập: <b>'+esc(A.email||'')+'</b></div><div class="hint" id="sync-st">'+syncText()+'</div><div class="btnrow"><button class="btn" data-act="cloud-sync">Đồng bộ ngay</button><button class="btn" data-act="cloud-out">Đăng xuất</button></div></section>';
  return '<section class="card sec"><div class="cardhead"><h2>Tài khoản</h2></div><div class="hint">Đăng nhập để dữ liệu được lưu trên đám mây. Mất điện thoại vẫn lấy lại được khi đăng nhập trên máy mới.</div><button class="btn pri wide" data-act="cloud-open">Đăng nhập / Đăng ký</button></section>';
}
function authOpen(closable){
  var mode='in',el=$('#auth');
  if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
  var keep={e:'',p:''};
  function paint(){
    var up=mode==='up';
    el.innerHTML='<div class="authbox"><div class="authlogo" role="img" aria-label="Sổ Chi Tiêu"></div><h1>Sổ Chi Tiêu</h1><div class="hint c">Đăng nhập để dữ liệu được lưu trên đám mây, mất máy vẫn lấy lại được.</div>'+
      '<div class="authtabs"><button type="button" data-au="mode-in" class="'+(up?'':'on')+'">Đăng nhập</button><button type="button" data-au="mode-up" class="'+(up?'on':'')+'">Đăng ký</button></div>'+
      '<form id="auf" novalidate><label for="au-e">Email</label><input id="au-e" class="inp" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="'+esc(keep.e)+'">'+
      '<label for="au-p">Mật khẩu'+(up?' (ít nhất 6 ký tự)':'')+'</label><input id="au-p" class="inp" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'+
      (up?'<label for="au-p2">Nhập lại mật khẩu</label><input id="au-p2" class="inp" type="password" autocomplete="new-password">':'')+
      '<div id="au-msg" class="aumsg" role="alert"></div><button class="btn pri wide" type="submit" id="au-go">'+(up?'Tạo tài khoản':'Đăng nhập')+'</button></form>'+

      (up?'':'<button type="button" class="txtbtn" data-au="forgot">Quên mật khẩu?</button>')+
      '<button type="button" class="txtbtn" data-au="about">Giới thiệu</button>'+
      '<button type="button" class="txtbtn" data-au="skip">'+(closable?'Đóng':'Dùng không cần tài khoản')+'</button></div>';
    el.hidden=false;
  }
  function msg(t,ok){var m=$('#au-msg');if(m){m.textContent=t;m.style.opacity=ok?'1':'.9';m.style.fontWeight=ok?'400':'600'}}
  function close(){el.hidden=true;el.innerHTML=''}
  function done(j,em){
    setSession(j);A.email=j.email||em||'';A.skip=false;saveAuth();
    return firstSync().then(function(){close();render(true);toast('Đã đăng nhập')});
  }
  function grab(){var e=$('#au-e'),p=$('#au-p');if(e)keep.e=e.value.trim()}
  el.onclick=function(ev){
    var b=ev.target.closest('[data-au]');if(!b)return;var a=b.dataset.au;
    if(a==='mode-in'||a==='mode-up'){grab();mode=a==='mode-up'?'up':'in';paint()}
    else if(a==='about'){openAbout()}
    else if(a==='skip'){if(!closable){A.skip=true;saveAuth()}close()}
    else if(a==='forgot'){
      grab();if(!/^\S+@\S+\.\S+$/.test(keep.e)){msg('Hãy nhập email của bạn ở ô trên rồi bấm lại.');return}
      msg('Đang gửi…',true);
      authCall('sendOobCode',{requestType:'PASSWORD_RESET',email:keep.e}).then(function(){msg('Đã gửi email đặt lại mật khẩu. Hãy kiểm tra hộp thư (cả thư rác).',true)}).catch(function(e){msg(authMsg(e))});
    }
  };
  el.onsubmit=function(ev){
    ev.preventDefault();grab();
    var em=keep.e,pw=$('#au-p').value,go=$('#au-go');
    if(!/^\S+@\S+\.\S+$/.test(em)){msg('Email chưa đúng.');return}
    if(pw.length<6){msg('Mật khẩu cần ít nhất 6 ký tự.');return}
    if(mode==='up'&&$('#au-p2').value!==pw){msg('Hai mật khẩu chưa giống nhau.');return}
    go.disabled=true;go.textContent='Đang xử lý…';msg('');
    authCall(mode==='up'?'signUp':'signInWithPassword',{email:em,password:pw,returnSecureToken:true}).then(function(j){return done(j,em)}).catch(function(e){
      var g=$('#au-go');if(g){g.disabled=false;g.textContent=mode==='up'?'Tạo tài khoản':'Đăng nhập'}
      msg(authMsg(e));
    });
  };
  paint();
}
window.addEventListener('online',function(){if(A.uid)pull()});
document.addEventListener('visibilitychange',function(){
  if(!A.uid)return;
  if(document.hidden){if(sync.pending){clearTimeout(pushT);push()}}
  else pull();
});

render();updSync();
if(A.uid)pull();else if(!A.skip)authOpen(false);
})();
</script>

</body></html>
